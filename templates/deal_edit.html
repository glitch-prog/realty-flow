{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <div>
        <span class="eyebrow">Редактирование</span>
        <h1>Сделка</h1>
        <p class="lead">Обновление параметров сделки с повторным применением бизнес-логики БД.</p>
    </div>
</section>

<form class="card form-card" method="post" action="/app/deals/{{ deal.id }}/update">
    <div class="section-heading">
        <h2>Параметры сделки</h2>
        <p>Комиссия пересчитывается автоматически при сохранении. Текущее значение: {{ deal.commission }}</p>
    </div>

    <label>
        <span>Объект</span>
        <select name="property_id">
            {% for item in properties %}
            <option value="{{ item.id }}" {% if item.id == deal.property_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Клиент</span>
        <select name="client_id">
            {% for item in clients %}
            <option value="{{ item.id }}" {% if item.id == deal.client_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Тип сделки</span>
        <select name="deal_type_id">
            {% for item in deal_types %}
            <option value="{{ item.id }}" {% if item.id == deal.deal_type_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Статус сделки</span>
        <select name="status_id">
            {% for item in deal_statuses %}
            <option value="{{ item.id }}" {% if item.id == deal.status_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <div class="split">
        <label>
            <span>Сумма</span>
            <input type="number" step="0.01" min="0" name="amount" value="{{ deal.amount }}" required>
        </label>
        <label>
            <span>Дата начала</span>
            <input type="date" name="start_date" value="{{ deal.start_date }}" required>
        </label>
    </div>

    <label>
        <span>Дата окончания</span>
        <input type="date" name="end_date" value="{{ deal.end_date }}">
    </label>

    <label>
        <span>Примечание</span>
        <textarea name="notes" rows="5">{{ deal.notes }}</textarea>
    </label>

    <div class="section-heading">
        <a class="ghost-button" href="/app/deals">Назад к списку</a>
        <button class="primary-button" type="submit">Сохранить изменения</button>
    </div>
</form>
{% endblock %}
