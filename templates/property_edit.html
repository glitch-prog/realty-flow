{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <div>
        <span class="eyebrow">Редактирование</span>
        <h1>Объект недвижимости</h1>
        <p class="lead">Обновление карточки объекта и её атрибутов.</p>
    </div>
</section>

<form class="card form-card" method="post" action="/app/properties/{{ property.id }}/update">
    <div class="section-heading">
        <h2>Параметры объекта</h2>
        <p>Изменения будут зафиксированы в журнале аудита.</p>
    </div>

    <label>
        <span>Название объекта</span>
        <input type="text" name="title" value="{{ property.title }}" required>
    </label>

    <label>
        <span>Собственник</span>
        <select name="owner_id">
            {% for owner in owners %}
            <option value="{{ owner.id }}" {% if owner.id == property.owner_id %}selected{% endif %}>{{ owner.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Категория</span>
        <select name="category_id">
            {% for item in categories %}
            <option value="{{ item.id }}" {% if item.id == property.category_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Статус</span>
        <select name="status_id">
            {% for item in statuses %}
            <option value="{{ item.id }}" {% if item.id == property.status_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Состояние</span>
        <select name="condition_id">
            {% for item in conditions %}
            <option value="{{ item.id }}" {% if item.id == property.condition_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Район</span>
        <select name="district_id">
            {% for item in districts %}
            <option value="{{ item.id }}" {% if item.id == property.district_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <div class="split">
        <label>
            <span>Площадь</span>
            <input type="number" step="0.01" min="1" name="area" value="{{ property.area }}" required>
        </label>
        <label>
            <span>Стоимость</span>
            <input type="number" step="0.01" min="0" name="price" value="{{ property.price }}" required>
        </label>
    </div>

    <label>
        <span>Адрес</span>
        <input type="text" name="address" value="{{ property.address }}" required>
    </label>

    <label>
        <span>Описание</span>
        <textarea name="description" rows="5">{{ property.description }}</textarea>
    </label>

    <div class="section-heading">
        <a class="ghost-button" href="/app/properties">Назад к списку</a>
        <button class="primary-button" type="submit">Сохранить изменения</button>
    </div>
</form>
{% endblock %}
