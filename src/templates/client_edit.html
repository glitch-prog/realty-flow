{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <div>
        <span class="eyebrow">Редактирование</span>
        <h1>Клиент</h1>
        <p class="lead">Корректировка клиентской карточки и предпочтений.</p>
    </div>
</section>

<form class="card form-card" method="post" action="/app/clients/{{ client.id }}/update">
    <div class="section-heading">
        <h2>Карточка клиента</h2>
        <p>После сохранения данные сразу доступны в сделках и отчетах.</p>
    </div>

    <label>
        <span>Тип клиента</span>
        <select name="client_type_id">
            {% for item in client_types %}
            <option value="{{ item.id }}" {% if item.id == client.client_type_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>ФИО</span>
        <input type="text" name="full_name" value="{{ client.full_name }}" required>
    </label>

    <label>
        <span>Телефон</span>
        <input type="text" name="phone" value="{{ client.phone }}" required>
    </label>

    <label>
        <span>Email</span>
        <input type="email" name="email" value="{{ client.email }}">
    </label>

    <label>
        <span>Бюджет</span>
        <input type="number" step="0.01" min="0" name="budget" value="{{ client.budget }}">
    </label>

    <label>
        <span>Предпочитаемая категория</span>
        <select name="preferred_category_id">
            <option value="" {% if client.preferred_category_id == 0 %}selected{% endif %}>Не выбрана</option>
            {% for item in categories %}
            <option value="{{ item.id }}" {% if item.id == client.preferred_category_id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        <span>Примечание</span>
        <textarea name="notes" rows="5">{{ client.notes }}</textarea>
    </label>

    <div class="section-heading">
        <a class="ghost-button" href="/app/clients">Назад к списку</a>
        <button class="primary-button" type="submit">Сохранить изменения</button>
    </div>
</form>
{% endblock %}
